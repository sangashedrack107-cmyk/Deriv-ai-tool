<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Deriv AI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#9fb0c5;
    margin-bottom:20px;
}

.card{
    background:#0d1b2d;
    border:1px solid #1d3550;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#a9bad0;
}

select,button{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:none;
    font-size:15px;
}

select{
    background:#14263d;
    color:white;
    margin-bottom:12px;
}

button{
    background:#1877f2;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.status{
    text-align:center;
    padding:10px;
    border-radius:10px;
    background:#18283c;
    margin-bottom:15px;
}

.live{
    color:#35e67c;
}

.price{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin:10px 0;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    background:#14263d;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.stat span{
    display:block;
    color:#9fb0c5;
    font-size:13px;
    margin-bottom:5px;
}

.signal{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    padding:15px;
    border-radius:12px;
    background:#14263d;
    margin-top:15px;
}

.reason{
    color:#b9c7d8;
    line-height:1.5;
    margin-top:12px;
}

.history{
    max-height:250px;
    overflow-y:auto;
}

.history div{
    padding:9px;
    border-bottom:1px solid #20354c;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 ELITE DERIV AI</h1>
<div class="subtitle">Live Market Analysis</div>

<div class="status" id="status">
🔴 Disconnected
</div>

<div class="card">

<label>Select Market</label>

<select id="market">
<option value="1HZ10V">Volatility 10 (1s)</option>
<option value="1HZ25V">Volatility 25 (1s)</option>
<option value="1HZ50V">Volatility 50 (1s)</option>
<option value="1HZ75V">Volatility 75 (1s)</option>
<option value="1HZ100V">Volatility 100 (1s)</option>
</select>

<button onclick="connectDeriv()">
🔄 CONNECT MARKET
</button>

</div>

<div class="card">

<div class="price" id="price">--</div>

<div class="stats">

<div class="stat">
<span>Ticks Received</span>
<b id="ticks">0</b>
</div>

<div class="stat">
<span>Last Digit</span>
<b id="digit">--</b>
</div>

<div class="stat">
<span>Direction</span>
<b id="direction">--</b>
</div>

<div class="stat">
<span>Market</span>
<b id="currentMarket">--</b>
</div>

</div>

</div>
<div class="card">

<h3>🎯 PREDICTION TYPE</h3>

<select id="predictionType" onchange="changePredictionType()">
    <option value="direction">CALL / PUT</option>
    <option value="matches">MATCHES</option>
    <option value="differs">DIFFERS</option>
</select>

<div class="stats">

<div class="stat">
<span>Prediction</span>
<b id="prediction">--</b>
</div>

<div class="stat">
<span>Confidence</span>
<b id="predictionConfidence">--</b>
</div>

</div>

</div>
<div class="card">

<h3>🧠 AI SIGNAL</h3>

<div class="signal" id="signal">
WAITING
</div>

<div class="stats">

<div class="stat">
<span>CALL</span>
<b id="callPercent">50%</b>
</div>

<div class="stat">
<span>PUT</span>
<b id="putPercent">50%</b>
</div>

</div>

<div class="reason" id="reason">
Waiting for enough live market data...
</div>

</div>

<div class="card">

<h3>📊 SIGNAL HISTORY</h3>

<div class="history" id="history">
No signals yet.
</div>

</div>

</div>

<script>

let ws = null;

let tickCount = 0;
let previousPrice = null;

let prices = [];
let digits = [];

let signalStrength = "WAIT";
let lastSignal = "";
let lastSignalTime = 0;

const statusEl = document.getElementById("status");
const priceEl = document.getElementById("price");
const ticksEl = document.getElementById("ticks");
const digitEl = document.getElementById("digit");
const directionEl = document.getElementById("direction");
const marketEl = document.getElementById("market");
const currentMarketEl = document.getElementById("currentMarket");

const signalEl = document.getElementById("signal");
const callEl = document.getElementById("callPercent");
const putEl = document.getElementById("putPercent");
const reasonEl = document.getElementById("reason");
const historyEl = document.getElementById("history");


function connectDeriv(){

    if(ws){
        ws.close();
    }

    tickCount = 0;
    previousPrice = null;
    prices = [];
    digits = [];

    ticksEl.textContent = "0";
    priceEl.textContent = "--";
    digitEl.textContent = "--";
    directionEl.textContent = "--";

    const symbol = marketEl.value;

    currentMarketEl.textContent = symbol;

    statusEl.innerHTML = "🟡 Connecting...";

    ws = new WebSocket(
        "wss://api.derivws.com/trading/v1/options/ws/public"
    );

    ws.onopen = function(){

        statusEl.innerHTML =
        '<span class="live">🟢 LIVE — Connected to Deriv</span>';

        /*
        Subscribe to market ticks
        */

        ws.send(JSON.stringify({
            ticks: symbol,
            subscribe: 1
        }));

    };


    ws.onmessage = function(event){

        try{

            const data = JSON.parse(event.data);

            if(!data.tick){
                return;
            }

            const price = Number(data.tick.quote);

            if(!Number.isFinite(price)){
                return;
            }

            tickCount++;

            priceEl.textContent = price;
            ticksEl.textContent = tickCount;

            /*
            Last digit
            */

            const priceString = price.toString();

            const lastDigit =
            Number(priceString.charAt(priceString.length - 1));

            digitEl.textContent = lastDigit;

            prices.push(price);
            digits.push(lastDigit);

            /*
            Keep only latest 30 ticks
            */

            if(prices.length > 30){
                prices.shift();
            }

            if(digits.length > 30){
                digits.shift();
            }


            /*
            Direction
            */

            let direction = "NEUTRAL";

            if(previousPrice !== null){

                if(price > previousPrice){
                    direction = "UP";
                }
                else if(price < previousPrice){
                    direction = "DOWN";
                }

            }

            directionEl.textContent = direction;


            /*
            Analyze after receiving enough ticks
            */

            if(prices.length >= 5){

                analyzeMarket();

            }

            previousPrice = price;

        }
        catch(error){

            console.log("Data error:", error);

        }

    };


    ws.onerror = function(){

        statusEl.innerHTML =
        "🔴 Connection Error";

    };


    ws.onclose = function(){

        statusEl.innerHTML =
        "🔴 Connection Closed";

    };

}


/*
AI MARKET ANALYSIS
*/
function changePredictionType(){

    const type =
    document.getElementById("predictionType").value;

    const signal =
    document.getElementById("signal");

    if(type === "direction"){
        signal.textContent = "WAITING";
    }

    if(type === "matches"){
        signal.textContent = "MATCHES";
    }

    if(type === "differs"){
        signal.textContent = "DIFFERS";
    }

function analyzeMarket(){

    if(prices.length < 5){
        return;
    }

    const type =
        document.getElementById("predictionType").value;

    /* =========================
       CALL / PUT ANALYSIS
    ========================== */

    if(type === "direction"){

        const recent = prices.slice(-10);

        let up = 0;
        let down = 0;

        for(let i = 1; i < recent.length; i++){

            if(recent[i] > recent[i-1]) up++;
            if(recent[i] < recent[i-1]) down++;

        }

        const total = up + down;

        if(total === 0) return;

        let callPercent =
            Math.round((up / total) * 100);

        let putPercent =
            100 - callPercent;

        callPercent =
            Math.max(35, Math.min(65, callPercent));

        putPercent = 100 - callPercent;

        let signal = "WAIT";

        if(callPercent >= 58){
            signal = "CALL";
        }
        else if(putPercent >= 58){
            signal = "PUT";
        }

        signalEl.textContent = signal;
        callEl.textContent = callPercent + "%";
        putEl.textContent = putPercent + "%";

        reasonEl.textContent =
            signal === "CALL"
            ? "Recent ticks show stronger upward movement."
            : signal === "PUT"
            ? "Recent ticks show stronger downward movement."
            : "Market movement is mixed. Waiting for stronger data.";

        return;
    }


    /* =========================
       MATCHES / DIFFERS
    ========================== */

    if(type === "matches" || type === "differs"){

        if(digits.length < 10){
            return;
        }

        const recentDigits =
            digits.slice(-20);

        /*
        Count frequency of each digit
        */

        const frequency = {};

        for(let d = 0; d <= 9; d++){
            frequency[d] = 0;
        }

        recentDigits.forEach(function(d){
            frequency[d]++;
        });


        /*
        Find most frequent digit
        */

        let targetDigit = 0;

        for(let d = 1; d <= 9; d++){

            if(frequency[d] > frequency[targetDigit]){
                targetDigit = d;
            }

        }


        const targetCount =
            frequency[targetDigit];

        const matchRate =
            Math.round(
                (targetCount / recentDigits.length) * 100
            );


        /*
        Matches = historical frequency
        Differs = opposite probability
        */

        let confidence =
            type === "matches"
            ? matchRate
            : 100 - matchRate;


        /*
        Keep confidence realistic
        */

        confidence =
            Math.max(50, Math.min(95, confidence));


        const prediction =
            type === "matches"
            ? "MATCH " + targetDigit
            : "DIFFER " + targetDigit;


        document.getElementById("prediction").textContent =
            prediction;

        document.getElementById("predictionConfidence").textContent =
            confidence + "%";


        signalEl.textContent =
            prediction;


        reasonEl.textContent =
            "Based on the last " +
            recentDigits.length +
            " live ticks, digit " +
            targetDigit +
            " appeared " +
            targetCount +
            " times (" +
            matchRate +
            "%).";


        /*
        Show MATCHES / DIFFERS percentages
        */

        callEl.textContent =
            type === "matches"
            ? matchRate + "%"
            : (100 - matchRate) + "%";

        putEl.textContent =
            type === "matches"
            ? (100 - matchRate) + "%"
            : matchRate + "%";


        /*
        Add to history
        */

        addHistory(
            prediction,
            type === "matches"
            ? matchRate
            : 100 - matchRate,
            type === "matches"
            ? 100 - matchRate
            : matchRate
        );

    }

}

    const recent =
    prices.slice(-10);

    let up = 0;
    let down = 0;

    for(let i = 1; i < recent.length; i++){

        if(recent[i] > recent[i-1]){
            up++;
        }

        if(recent[i] < recent[i-1]){
            down++;
        }

    }

    const total = up + down;

    if(total === 0){
        return;
    }

    let callPercent =
    Math.round((up / total) * 100);

    let putPercent =
    100 - callPercent;


    /*
    Avoid extreme fake confidence
    */

    callPercent =
    Math.max(35, Math.min(65, callPercent));

    putPercent =
    100 - callPercent;


    let signal = "WAIT";

    if(callPercent >= 58){
        signal = "CALL";
    }
    else if(putPercent >= 58){
        signal = "PUT";
    }


    callEl.textContent =
    callPercent + "%";

    putEl.textContent =
    putPercent + "%";

    signalEl.textContent =
    signal;


    let reason = "";

    if(signal === "CALL"){

        reason =
        "Recent ticks show more upward movement than downward movement.";

    }
    else if(signal === "PUT"){

        reason =
        "Recent ticks show more downward movement than upward movement.";

    }
    else{

        reason =
        "Market movement is mixed. Waiting for stronger tick direction.";

    }

    reasonEl.textContent = reason;


    /*
    Save signal history
    */

    if(signal !== "WAIT"){

        addHistory(
            signal,
            callPercent,
            putPercent
        );

    }

}


/*
HISTORY
*/

function addHistory(signal, call, put){

    const time =
    new Date().toLocaleTimeString();

    const item =
    document.createElement("div");

    item.innerHTML =
    "🕐 " + time +
    " — <b>" + signal +
    "</b> — CALL " +
    call + "% / PUT " +
    put + "%";

    historyEl.prepend(item);

    /*
    Keep last 15 signals
    */

    while(historyEl.children.length > 15){

        historyEl.removeChild(
            historyEl.lastChild
        );

    }

}

</script>

</body>
</html>
