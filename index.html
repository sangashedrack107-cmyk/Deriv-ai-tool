<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Deriv AI</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #080b12;
    color: white;
}

.header {
    text-align: center;
    padding: 20px;
    background: #111827;
}

.header h1 {
    margin: 0;
}

.header p {
    color: #9ca3af;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 18px;
}

.card {
    background: #111827;
    border: 1px solid #263244;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 15px;
}

.status {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    background: #172033;
}

.live-price {
    text-align: center;
    font-size: 35px;
    font-weight: bold;
    margin: 15px 0;
}

.tick-count {
    text-align: center;
    color: #9ca3af;
}

select,
button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

select {
    background: #1f2937;
    color: white;
}

button {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

.signal {
    text-align: center;
    padding: 20px;
}

.signal-value {
    font-size: 38px;
    font-weight: bold;
}

.call {
    color: #22c55e;
}

.put {
    color: #ef4444;
}

.wait {
    color: #facc15;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.box {
    background: #1a2333;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
}

.value {
    font-size: 24px;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    padding: 20px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🤖 ELITE DERIV AI</h1>
    <p>Live Market Analysis</p>
</div>

<div class="container">

    <div class="card">
        <div id="status" class="status">
            🟡 Connecting to Deriv...
        </div>

        <div id="price" class="live-price">
            --
        </div>

        <div id="ticks" class="tick-count">
            Ticks received: 0
        </div>
    </div>

    <div class="card">

        <label>Market</label>

        <select id="market">
            <option value="1HZ10V">Volatility 10 (1s)</option>
            <option value="1HZ25V">Volatility 25 (1s)</option>
            <option value="1HZ50V">Volatility 50 (1s)</option>
            <option value="1HZ75V">Volatility 75 (1s)</option>
            <option value="1HZ100V">Volatility 100 (1s)</option>
        </select>

        <button onclick="changeMarket()">
            🔄 CONNECT MARKET
        </button>

    </div>

    <div class="card signal">

        <div>AI SIGNAL</div>

        <div id="signal" class="signal-value wait">
            WAIT
        </div>

        <div id="confidence">
            Confidence: --
        </div>

        <p id="reason">
            Waiting for live market data...
        </p>

    </div>

    <div class="card">

        <h3>📊 Live Analysis</h3>

        <div class="grid">

            <div class="box">
                <div>Last Digit</div>
                <div id="digit" class="value">--</div>
            </div>

            <div class="box">
                <div>Direction</div>
                <div id="direction" class="value">--</div>
            </div>

            <div class="box">
                <div>CALL</div>
                <div id="call" class="value call">--</div>
            </div>

            <div class="box">
                <div>PUT</div>
                <div id="put" class="value put">--</div>
            </div>

        </div>

    </div>

</div>

<div class="footer">
    ELITE FX ACADEMY © 2026
</div>

<script>

let ws;
let currentSymbol = "1HZ10V";
let tickCount = 0;
let previousPrice = null;

function connectDeriv() {

    if (ws) {
        ws.close();
    }

    document.getElementById("status").innerHTML =
        "🟡 Connecting to Deriv...";

    ws = new WebSocket(
        "wss://api.derivws.com/trading/v1/options/ws/public"
    );

    ws.onopen = function() {

        document.getElementById("status").innerHTML =
            "🟢 LIVE — Connected to Deriv";

        ws.send(JSON.stringify({
            ticks: currentSymbol,
            subscribe: 1
        }));
    };

    ws.onmessage = function(event) {

        const data = JSON.parse(event.data);

        if (data.msg_type === "tick") {

            const price = data.tick.quote;

            tickCount++;

            document.getElementById("price").innerHTML =
                price;

            document.getElementById("ticks").innerHTML =
                "Ticks received: " + tickCount;

            const lastDigit =
                String(price).replace(".", "").slice(-1);

            document.getElementById("digit").innerHTML =
                lastDigit;

            if (previousPrice !== null) {

                if (price > previousPrice) {

                    document.getElementById("direction").innerHTML =
                        "UP";

                } else if (price < previousPrice) {

                    document.getElementById("direction").innerHTML =
                        "DOWN";

                } else {

                    document.getElementById("direction").innerHTML =
                        "SAME";
                }
            }

            previousPrice = price;

            analyzeLiveData(price);
        }
    };

    ws.onerror = function() {

        document.getElementById("status").innerHTML =
            "🔴 Connection Error";
    };

    ws.onclose = function() {

        document.getElementById("status").innerHTML =
            "🔴 Disconnected";
    };
}


function analyzeLiveData(price) {

    if (previousPrice === null) {
        return;
    }

    let callProbability;
    let putProbability;

    if (price > previousPrice) {

        callProbability = 58;
        putProbability = 42;

    } else if (price < previousPrice) {

        callProbability = 42;
        putProbability = 58;

    } else {

        callProbability = 50;
        putProbability = 50;
    }

    document.getElementById("call").innerHTML =
        callProbability + "%";

    document.getElementById("put").innerHTML =
        putProbability + "%";

    if (callProbability > putProbability) {

        document.getElementById("signal").innerHTML =
            "🟢 CALL";

        document.getElementById("signal").className =
            "signal-value call";

        document.getElementById("confidence").innerHTML =
            "Confidence: " + callProbability + "%";

        document.getElementById("reason").innerHTML =
            "Latest tick movement is upward.";

    } else if (putProbability > callProbability) {

        document.getElementById("signal").innerHTML =
            "🔴 PUT";

        document.getElementById("signal").className =
            "signal-value put";

        document.getElementById("confidence").innerHTML =
            "Confidence: " + putProbability + "%";

        document.getElementById("reason").innerHTML =
            "Latest tick movement is downward.";

    } else {

        document.getElementById("signal").innerHTML =
            "WAIT";

        document.getElementById("signal").className =
            "signal-value wait";

        document.getElementById("confidence").innerHTML =
            "Confidence: 50%";

        document.getElementById("reason").innerHTML =
            "Market movement is currently neutral.";
    }
}


function changeMarket() {

    currentSymbol =
        document.getElementById("market").value;

    tickCount = 0;
    previousPrice = null;

    connectDeriv();
}


connectDeriv();

</script>

</body>
</html>
