<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Deriv AI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

h1{text-align:center;margin-bottom:5px}

.subtitle{
    text-align:center;
    color:#9fb0c5;
    margin-bottom:20px;
}

.card{
    background:#0d1b2d;
    border:1px solid #1d3550;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#a9bad0;
}

select,button{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:none;
    font-size:15px;
}

select{
    background:#14263d;
    color:white;
    margin-bottom:12px;
}

button{
    background:#1877f2;
    color:white;
    font-weight:bold;
}

.status{
    text-align:center;
    padding:10px;
    border-radius:10px;
    background:#18283c;
    margin-bottom:15px;
}

.live{color:#35e67c}

.price{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin:10px 0;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    background:#14263d;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.stat span{
    display:block;
    color:#9fb0c5;
    font-size:13px;
    margin-bottom:5px;
}

.signal{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    padding:15px;
    border-radius:12px;
    background:#14263d;
    margin-top:15px;
}

.reason{
    color:#b9c7d8;
    line-height:1.5;
    margin-top:12px;
}

.history{
    max-height:250px;
    overflow-y:auto;
}

.history div{
    padding:9px;
    border-bottom:1px solid #20354c;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 ELITE DERIV AI</h1>
<div class="subtitle">Live Market Analysis</div>

<div class="status" id="status">
🔴 Disconnected
</div>

<div class="card">

<label>Market</label>

<select id="market">
<option value="1HZ10V">Volatility 10 (1s)</option>
<option value="1HZ25V">Volatility 25 (1s)</option>
<option value="1HZ50V">Volatility 50 (1s)</option>
<option value="1HZ75V">Volatility 75 (1s)</option>
<option value="1HZ100V">Volatility 100 (1s)</option>
</select>

<button onclick="connectDeriv()">
🔄 CONNECT MARKET
</button>

</div>

<div class="card">

<div class="price" id="price">--</div>

<div class="stats">

<div class="stat">
<span>Ticks Received</span>
<b id="ticks">0</b>
</div>

<div class="stat">
<span>Last Digit</span>
<b id="digit">--</b>
</div>

<div class="stat">
<span>Direction</span>
<b id="direction">--</b>
</div>

<div class="stat">
<span>Market</span>
<b id="currentMarket">--</b>
</div>

</div>
</div>


<div class="card">

<h3>🎯 PREDICTION TYPE</h3>

<select id="predictionType">
<option value="direction">CALL / PUT</option>
<option value="matches">MATCHES</option>
<option value="differs">DIFFERS</option>
</select>

</div>


<div class="card">

<h3>🧠 AI SIGNAL</h3>

<div class="signal" id="signal">
WAITING
</div>

<div class="stats">

<div class="stat">
<span>CALL / MATCHES</span>
<b id="callPercent">50%</b>
</div>

<div class="stat">
<span>PUT / DIFFERS</span>
<b id="putPercent">50%</b>
</div>

</div>

<div class="reason" id="reason">
Waiting for enough live market data...
</div>

</div>


<div class="card">

<h3>📊 SIGNAL HISTORY</h3>

<div class="history" id="history">
No signals yet.
</div>

</div>

</div>
